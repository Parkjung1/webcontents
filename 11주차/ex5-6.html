<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Document</title>
    <style>
        div {
            position: absolute;
        }
        img {
            position: absolute;
        }
        #spadeA {
            z-index: -3; left: 10px; top: 20px;
        }
        #spade4 {
            z-index: 2; left: 40px; top: 30px;
        }
        #spade7 {
            z-index: 3; left: 80px; top: 40px;
        }
        #spade8 {
            z-index: 7; left: 120px; top: 50px;
        }
    </style>
</head>
<body>
    <h3>z-index 프로퍼티</h3>
    <hr>
    <div>
        <img id="spadeA" src="img/sp1.png" width="100" height="140" alt="스페이드A">
        <img id="spade4" src="img/sp2.jpg" width="100" height="140" alt="스페이드4">
        <img id="spade7" src="img/sp3.png" width="100" height="140" alt="스페이드7">
        <img id="spade8" src="img/sp4.jpg" width="100" height="140" alt="스페이드8">
    </div>
</body>
</html>
