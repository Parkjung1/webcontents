<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Document</title>
    <script>
        function evalIp(){
            let res = eval(n)
            document.write(n + " = " + res);
        }
    </script>
</head>
<body>
    <h3>eval()로 수식 계산</h3>
    <hr>
    <script>
        let n = prompt("수식 입력", "");
        evalIp();
    </script>
</body>
</html>
