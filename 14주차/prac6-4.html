<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Document</title>
</head>
<body>
    <h3>월화수목금토일</h3>
    <hr>
    <script>
        let num = prompt("월화수목금토일 중에서 입력하세요.");
        switch(num){
            case "월":
            case "화":
            case "수":
            case "목":
                document.write(num + "는 출근 입니다.<br>");
                break;
            case "금":
            case "토":
            case "일":
                document.write(num + "는 휴일 입니다.<br>");
        }
    </script>
</body>
</html>
