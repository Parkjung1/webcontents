<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Document</title>
    <script>
        function big(a, b) {
            let bii;
            if(a>b){
                bii = a;
            }
            else
                bii = b;
            return bii;
        }
        function pr(p, cnt) {
            for (i=0; i<cnt; i++){
                document.write(p)
            }
        }
    </script>
</head>
<body>
    <h3>함수</h3>
    <hr>
    <script>
        let b = big("625", "555");
        document.write("큰수= ", b + "<br>");
    </script>
    <script>
        pr("%", 5);
    </script>
</body>
</html>
