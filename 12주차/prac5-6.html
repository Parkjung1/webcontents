<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Document</title>
    <style>
        @keyframes bob {
            from {transform: rotate(0);}
            to {transform: rotate(360deg);}
        }
        @keyframes spange {
            from {transform: rotate(-90deg);}
            to {transform: rotate(90deg);}
        }
        img {
            animation-name: bob;
            animation-duration: 1s;
            animation-iteration-count: infinite;
        }
        p > img {
            animation-name: spange;
            animation-duration: 1s;
            animation-iteration-count: infinite;
        }
    </style>
</head>
<body>
    <img src="img/bob.jpg">
    <p><img src="img/spange.jpg"></p>
</body>
</html>
