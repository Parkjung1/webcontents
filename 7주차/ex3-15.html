<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>시간 정보를 입력하는 폼 활용</title>
</head>
<body>
    <h3>시간 정보를 입력 HTML5 폼 요소들</h3>
    초기 세팅 : 2026년 4월15일 오전 11시 8분(30초 30)<br>
    시간을 변경해 보세요
    <hr>
    <form>
        <pre>
            month: <input type="month" value="2026-04"><br>
            week: <input type="week" value="2026-W16"><br>
            date: <input type="date" value="2026-04-15"><br>
            time: <input type="time" value="11:08"><br>
            local: <input type="datetime-local" value="2026-04-15T11:08:30:30"><br>
        </pre>
    </form>
</body>
</html>
