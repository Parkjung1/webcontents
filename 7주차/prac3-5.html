<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>도형 서식 폼 만들기</title>
</head>
<body>
    <h3>도형 서식 폼 만들기</h3>
    <hr>
    도형 서식 입력<br>
    선종류 <select name="s" size="3">
        <option value="1">선 없음</option>
        <option value="2">실선</option>
        <option value="3">점선</option>
    </select>
    <br>
    선 두께 <input type="number" min="0" max="10" step="1"> 선색 <input type="color" value="#87CEEB"><br>
    투명도 (0~100): <input type="range" min="0" max="100" list="sin">
    <datalist id="sin">
        <option value="10" label="low"></option>
        <option value="50" label="medium"></option>
        <option value="90" label="high"></option>
    </datalist>
</body>
</html>
