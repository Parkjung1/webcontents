<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>css색활용</title>
    <style>
        div {
            margin-left: 30px;
            margin-right: 30px;
            margin-bottom: 10px;
            color: white;
        }
    </style>
</head>
<body>
    <h3>css색활용</h3>
    <hr>
    <div style="background-color: deepskyblue;">deepskyblue(#00BFFF)</div>
    <div style="background-color: brown;">brown(#A52A2A)</div>
    <div style="background-color: fuchsia;">fuchsia(#FF00FF)</div>
    <div style="background-color: darkorange;">darkorange(#FF8C00)</div>
    <div style="background-color: #008888;">darkcyan(#008888)</div>
    <div style="background-color: #688E23;">olivedrab(#688E23)</div>
</body>
</html>
